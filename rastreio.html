<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Acompanhe sua OS — Mobit Soluções</title>
<style>
  :root{
    --bg: #15181c;
    --bg-soft: #1c2126;
    --panel: #20262c;
    --panel-2: #262d34;
    --border: #343c45;
    --text: #e8ebee;
    --text-dim: #9aa5b1;
    --text-faint: #6b7682;
    --accent: #2da0e0;
    --accent-bg: rgba(45,160,224,0.12);
    --green: #4ade80;
    --green-bg: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-bg: rgba(248,113,113,0.12);
    --blue: #60a5fa;
    --blue-bg: rgba(96,165,250,0.12);
    --yellow: #fbbf24;
    --yellow-bg: rgba(251,191,36,0.12);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,0.12);
    --radius: 10px;
    --mono: 'JetBrains Mono', 'Roboto Mono', monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    padding: 16px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .topbar img{ height:28px; }
  .topbar .sair{ font-size:12px; color:var(--text-faint); text-decoration:none; cursor:pointer; }
  .topbar .sair:hover{ color:var(--text-dim); }

  .card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .section-title{
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 18px 0 8px;
  }
  .section-title:first-child{ margin-top:0; }

  /* ---- Login ---- */
  #login-view{ display:flex; align-items:center; justify-content:center; min-height:70vh; }
  .login-card{ width:100%; max-width:360px; text-align:center; }
  .login-card h1{ font-size:18px; margin-bottom:6px; }
  .login-card p{ color:var(--text-dim); font-size:13px; margin-bottom:20px; }
  .senha-input{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 22px;
    text-align: center;
    letter-spacing: 6px;
    color: var(--text);
    font-family: var(--mono);
    outline: none;
    margin-bottom: 14px;
  }
  .senha-input:focus{ border-color: var(--accent); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:100%;
    padding: 13px;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .btn:hover:not(:disabled){ filter:brightness(1.08); }
  .erro{
    display:none;
    margin-top: 12px;
    background: var(--red-bg);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--red);
  }
  .erro.show{ display:block; }

  /* ---- Tracking view ---- */
  #track-view{ display:none; }
  .os-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .os-header h2{ font-size:17px; font-weight:700; }
  .os-header .sub{ color:var(--text-dim); font-size:12.5px; margin-top:2px; }
  .live{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-faint); margin-top:4px; }
  .live .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .badge{
    display:inline-flex; align-items:center; gap:5px;
    padding: 4px 10px; border-radius: 100px;
    font-size: 11.5px; font-weight:600; white-space:nowrap;
  }
  .badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .badge-aberto{ background: var(--blue-bg); color: var(--blue); }
  .badge-andamento{ background: var(--yellow-bg); color: var(--yellow); }
  .badge-aguardando{ background: var(--purple-bg); color: var(--purple); }
  .badge-concluido{ background: var(--green-bg); color: var(--green); }
  .badge-entregue{ background: rgba(255,255,255,0.08); color: var(--text-dim); }
  .badge-cancelado{ background: var(--red-bg); color: var(--red); }

  .timeline{ display:flex; flex-direction:column; gap:14px; }
  .timeline-item{ display:flex; gap:12px; }
  .timeline-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:5px; flex-shrink:0; box-shadow:0 0 0 3px var(--accent-bg); }
  .timeline-content small{ display:block; color:var(--text-faint); font-size:11px; margin-bottom:2px; }

  .kv-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
  .kv-row{ display:flex; flex-direction:column; gap:2px; }
  .kv-label{ font-size:11px; color:var(--text-faint); }
  .kv-value{ font-size:13.5px; }
  .mono{ font-family:var(--mono); }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11px; color:var(--text-faint); text-transform:uppercase; padding:0 0 8px; border-bottom:1px solid var(--border); }
  td{ padding:8px 0; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  .checklist-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:12px; }
  .cl-row{ display:flex; justify-content:space-between; padding:5px 8px; background:var(--panel-2); border-radius:5px; }

  .fotos-grid{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
  .fotos-grid img{ width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer; }

  .text-faint{ color:var(--text-faint); }
  .text-dim{ color:var(--text-dim); }
  .footer-note{ text-align:center; color:var(--text-faint); font-size:11px; margin-top:20px; }

  @media (max-width:420px){
    .kv-list, .checklist-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- ===== LOGIN ===== -->
  <div id="login-view">
    <div class="login-card">
      <img src="logo.png" alt="Mobit Soluções" style="height:40px; margin-bottom:18px;" onerror="this.style.display='none'">
      <h1 id="login-title">Acompanhar ordem de serviço</h1>
      <p>Digite a senha de acesso que você recebeu pra ver o andamento da sua OS.</p>
      <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="senha-input" id="inp-senha" placeholder="••••••" autofocus>
      <button class="btn" id="btn-entrar" onclick="tentarAcesso()">Ver andamento</button>
      <div class="erro" id="login-erro"></div>
    </div>
  </div>

  <!-- ===== ACOMPANHAMENTO ===== -->
  <div id="track-view">
    <div class="topbar">
      <img src="logo.png" alt="Mobit Soluções" onerror="this.style.display='none'">
      <a class="sair" onclick="sair()">Sair</a>
    </div>

    <div class="os-header">
      <div>
        <h2 id="os-titulo">OS #0000</h2>
        <div class="sub" id="os-cliente"></div>
        <div class="live"><span class="dot"></span><span id="os-atualizado">acompanhando em tempo real</span></div>
      </div>
      <span class="badge" id="os-badge"></span>
    </div>

    <div class="card">
      <div class="section-title">Histórico</div>
      <div class="timeline" id="os-timeline"></div>
    </div>

    <div class="card">
      <div class="section-title">Detalhes do reparo</div>
      <div class="kv-list" id="os-detalhes"></div>
    </div>

    <div class="card" id="card-checklist" style="display:none;">
      <div class="section-title">Checklist de recebimento</div>
      <div class="checklist-grid" id="os-checklist"></div>
    </div>

    <div class="card" id="card-fotos" style="display:none;">
      <div class="section-title">Fotos</div>
      <div id="os-fotos"></div>
    </div>

    <div class="card" id="card-pecas" style="display:none;">
      <div class="section-title">Peças e serviços</div>
      <div id="os-pecas"></div>
      <div style="text-align:right; font-weight:700; font-size:15px; color:var(--accent); padding-top:10px;">
        Total: <span id="os-total"></span>
      </div>
    </div>

    <div class="card" id="card-obs" style="display:none;">
      <div class="section-title">Observações</div>
      <p id="os-obs" style="font-size:13px;"></p>
    </div>

    <div class="erro" id="track-erro"></div>
    <div class="footer-note">Mobit Soluções · página de acompanhamento</div>
  </div>

</div>

<script>
const SB_URL = 'https://zrghmwdzxslpuyglsvnq.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpyZ2htd2R6eHNscHV5Z2xzdm5xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwOTE0NzksImV4cCI6MjA5NzY2NzQ3OX0.l2KE4vTA7CsXBGdRIfuBFqiHBACSueXUO8neEKXsOX4';

const token = new URLSearchParams(location.search).get('t');
let pollTimer = null;

function escapeHtml(str){
  if(str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatCurrency(v){
  return 'R$ ' + (Number(v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function formatDate(dStr){
  if(!dStr) return '—';
  const [y,m,d] = dStr.split('-');
  return `${d}/${m}/${y}`;
}
function statusBadgeClass(status){
  const map = {
    'Aberto':'badge-aberto', 'Aguardando aparelho':'badge-aguardando', 'Em andamento':'badge-andamento',
    'Aguardando peça':'badge-aguardando', 'Aguardando aprovação':'badge-aguardando',
    'Concluído':'badge-concluido', 'Entregue':'badge-entregue', 'Cancelado':'badge-cancelado'
  };
  return map[status] || 'badge-aberto';
}

if(!token){
  document.getElementById('login-title').textContent = 'Link inválido';
  document.querySelector('#login-view p').textContent = 'Esse link de acompanhamento está incompleto ou incorreto. Confira com a assistência técnica.';
  document.getElementById('inp-senha').style.display = 'none';
  document.getElementById('btn-entrar').style.display = 'none';
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if(e.key === 'Enter') tentarAcesso(); });

async function verificarAcesso(senha){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/verificar_acesso_rastreio`, {
    method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token, p_senha: senha })
  });
  if(!r.ok) throw new Error('Falha ao consultar (' + r.status + ')');
  return r.json();
}

async function tentarAcesso(){
  const senha = document.getElementById('inp-senha').value.trim();
  const erro = document.getElementById('login-erro');
  const btn = document.getElementById('btn-entrar');
  erro.classList.remove('show');
  if(!senha){ erro.textContent = 'Digite a senha de acesso.'; erro.classList.add('show'); return; }

  btn.disabled = true; btn.textContent = 'Verificando...';
  try {
    const rows = await verificarAcesso(senha);
    if(!rows || !rows.length){
      erro.textContent = 'Senha incorreta. Confira o código enviado pra você.';
      erro.classList.add('show');
      btn.disabled = false; btn.textContent = 'Ver andamento';
      return;
    }
    sessionStorage.setItem('rastreio_senha_' + token, senha);
    mostrarAcompanhamento(rows[0]);
    iniciarPolling(senha);
  } catch(e){
    erro.textContent = 'Não foi possível verificar agora. Tente novamente em instantes.';
    erro.classList.add('show');
    btn.disabled = false; btn.textContent = 'Ver andamento';
  }
}

function sair(){
  sessionStorage.removeItem('rastreio_senha_' + token);
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('track-view').style.display = 'none';
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('inp-senha').value = '';
}

function iniciarPolling(senha){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if(document.visibilityState !== 'visible') return;
    try {
      const rows = await verificarAcesso(senha);
      if(!rows || !rows.length){
        clearInterval(pollTimer);
        document.getElementById('track-erro').textContent = 'Esse link parou de funcionar (provavelmente foi gerado um novo). Peça um link atualizado à assistência técnica.';
        document.getElementById('track-erro').classList.add('show');
        return;
      }
      mostrarAcompanhamento(rows[0]);
    } catch(e){ /* falha de rede pontual — tenta de novo no próximo ciclo */ }
  }, 8000);
}

// Ao voltar pra aba, atualiza na hora em vez de esperar o próximo ciclo
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && pollTimer){
    const senha = sessionStorage.getItem('rastreio_senha_' + token);
    if(senha) verificarAcesso(senha).then(rows => { if(rows && rows.length) mostrarAcompanhamento(rows[0]); }).catch(()=>{});
  }
});

function mostrarAcompanhamento(o){
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('track-view').style.display = 'block';

  document.getElementById('os-titulo').textContent = `OS #${o.numero} — ${o.aparelho || ''}`;
  document.getElementById('os-cliente').textContent = o.cliente_nome || '';
  document.getElementById('os-atualizado').textContent = 'atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const badge = document.getElementById('os-badge');
  badge.className = 'badge ' + statusBadgeClass(o.status);
  badge.textContent = o.status;

  // Histórico
  const hist = (o.historico || []).slice().reverse();
  document.getElementById('os-timeline').innerHTML = hist.length
    ? hist.map(h => `
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-content">
            <small>${formatDate(h.date)}</small>
            ${escapeHtml(h.text)}
          </div>
        </div>`).join('')
    : `<p class="text-faint">Nenhum histórico registrado ainda.</p>`;

  // Detalhes
  const det = [];
  if(o.defeito) det.push(['Defeito relatado', escapeHtml(o.defeito)]);
  if(o.diagnostico) det.push(['Diagnóstico técnico', escapeHtml(o.diagnostico)]);
  det.push(['Entrada', formatDate(o.data_entrada)]);
  det.push(['Previsão', formatDate(o.data_prevista)]);
  if(o.pagamento) det.push(['Forma de pagamento', escapeHtml(o.pagamento)]);
  if(o.garantia) det.push(['Garantia', escapeHtml(String(o.garantia)) + ' dias']);
  if(o.acessorios) det.push(['Acessórios', escapeHtml(o.acessorios)]);
  document.getElementById('os-detalhes').innerHTML = det.map(([l,v]) =>
    `<div class="kv-row"><span class="kv-label">${l}</span><span class="kv-value">${v}</span></div>`
  ).join('');

  // Checklist
  const clLabels = [
    ['cl-liga','Liga?'],['cl-carrega','Carrega?'],['cl-display','Display'],['cl-touch','Touch'],
    ['cl-vidro','Vidro'],['cl-tampa','Tampa Traseira'],['cl-camtraseira','Câmera Traseira'],['cl-camfrontal','Câmera Frontal'],
    ['cl-faceid','Face ID'],['cl-biometria','Biometria'],['cl-microfone','Microfone'],['cl-altofalante','Alto Falante'],
    ['cl-auricular','Auricular'],['cl-sinal','Sinal Operadora'],['cl-wifi','Wifi'],['cl-bluetooth','Bluetooth'],
    ['cl-sensor','Sensor de Proximidade'],['cl-gaveta','Gaveta de Chip'],['cl-power','Botão Power'],['cl-volume','Botão Volume']
  ];
  const cl = o.checklist || {};
  if(Object.keys(cl).length){
    document.getElementById('card-checklist').style.display = 'block';
    document.getElementById('os-checklist').innerHTML = clLabels.map(([k,label]) => {
      const v = cl[k] || '—';
      const color = v === 'Sim' ? 'var(--green)' : v === 'Não' ? 'var(--red)' : 'var(--text-faint)';
      return `<div class="cl-row"><span class="text-dim">${label}</span><span style="font-weight:600; color:${color};">${v}</span></div>`;
    }).join('');
  } else {
    document.getElementById('card-checklist').style.display = 'none';
  }

  // Fotos
  const devs = [{ id:'principal', n:1, nome:o.aparelho }].concat((o.aparelhos_extras || []).map((a,i) => ({ id:a.id || ('x'+i), n:i+2, nome:a.modelo })));
  const ap = (o.fotos && o.fotos.ap) || {};
  const temFotos = devs.some(d => ((ap[d.id]||{}).entrada||[]).length || ((ap[d.id]||{}).saida||[]).length);
  if(temFotos){
    document.getElementById('card-fotos').style.display = 'block';
    const col = (d, stage, label) => {
      const fs = (ap[d.id]||{})[stage] || [];
      if(!fs.length) return '';
      return `<div style="margin-bottom:10px;">
        <div style="font-size:11px; color:var(--text-faint); margin-bottom:4px;">Aparelho ${d.n} — ${label}</div>
        <div class="fotos-grid">${fs.map(f => `<img src="${f.url}" alt="" loading="lazy" onclick="window.open('${f.url}','_blank')">`).join('')}</div>
      </div>`;
    };
    document.getElementById('os-fotos').innerHTML = devs.map(d => col(d,'entrada','Entrada') + col(d,'saida','Saída')).join('');
  } else {
    document.getElementById('card-fotos').style.display = 'none';
  }

  // Peças e serviços
  const parts = o.parts || [];
  const extras = o.aparelhos_extras || [];
  const temPecas = parts.length || o.mao_obra || extras.length;
  if(temPecas){
    document.getElementById('card-pecas').style.display = 'block';
    const tabelaPecas = (lista, maoObra) => `
      <table style="margin-bottom:10px;">
        <thead><tr><th>Item</th><th>Qtd.</th><th>Preço</th><th>Subtotal</th></tr></thead>
        <tbody>
          ${lista.map(p => `<tr><td>${escapeHtml(p.nome)}</td><td class="mono">${p.qtd}</td><td class="mono">${formatCurrency(p.preco)}</td><td class="mono">${formatCurrency(p.qtd*p.preco)}</td></tr>`).join('')}
          ${maoObra ? `<tr><td colspan="3" style="text-align:right; font-weight:600;">Mão de obra</td><td class="mono">${formatCurrency(maoObra)}</td></tr>` : ''}
        </tbody>
      </table>`;
    let html = `<div style="font-size:12px; font-weight:700; color:var(--accent); margin-bottom:6px;">Aparelho 1 — ${escapeHtml(o.aparelho||'')}</div>` + tabelaPecas(parts, o.mao_obra);
    extras.forEach((a,i) => {
      html += `<div style="font-size:12px; font-weight:700; color:var(--accent); margin:12px 0 6px;">Aparelho ${i+2} — ${escapeHtml(a.modelo||'')}</div>` + tabelaPecas(a.parts||[], a.maoObra);
    });
    document.getElementById('os-pecas').innerHTML = html;
    document.getElementById('os-total').textContent = formatCurrency(o.total);
  } else {
    document.getElementById('card-pecas').style.display = 'none';
  }

  // Observações
  if(o.observacoes){
    document.getElementById('card-obs').style.display = 'block';
    document.getElementById('os-obs').textContent = o.observacoes;
  } else {
    document.getElementById('card-obs').style.display = 'none';
  }
}

// Se já tem senha salva nessa aba pra esse token, entra direto sem pedir de novo
(function autoEntrar(){
  if(!token) return;
  const senhaSalva = sessionStorage.getItem('rastreio_senha_' + token);
  if(!senhaSalva) return;
  verificarAcesso(senhaSalva).then(rows => {
    if(rows && rows.length){ mostrarAcompanhamento(rows[0]); iniciarPolling(senhaSalva); }
  }).catch(()=>{});
})();
</script>
</body>
</html>
